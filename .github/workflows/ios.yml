name: build-ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Used only to publish compiler diagnostics to a single tracking issue, so
  # build failures are readable without admin access to the workflow logs.
  issues: write

jobs:
  build:
    name: Build unsigned IPA
    # macos-26 ships Xcode 26.x, which has the iOS 26 SDK that Liquid Glass needs.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Show toolchain
        run: |
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      # This step always succeeds so the log always exists; the gate below turns
      # a failed type-check into a red build.
      - name: Type-check app against iOS SDK
        run: |
          set +e
          mkdir -p ci
          ./scripts/typecheck-ios.sh > ci/typecheck.log 2>&1
          echo "exit=$?" >> ci/typecheck.log
          cat ci/typecheck.log

      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          log=ci/typecheck.log
          if [ ! -f "$log" ]; then
            echo "No diagnostics file produced."
            exit 0
          fi
          if ! grep -qE '^exit=[1-9]' "$log"; then
            echo "Type-check passed, nothing to publish."
            exit 0
          fi

          # Keep one sticky issue instead of filing a new one per push.
          title="CI diagnostics"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)

          # GitHub caps issue bodies at 65536 characters.
          head -c 60000 "$log" > ci/diagnostics-body.md

          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file ci/diagnostics-body.md >/dev/null
            echo "Updated issue #$number"
          else
            gh issue create --title "$title" --body-file ci/diagnostics-body.md >/dev/null
            echo "Created tracking issue"
          fi

      - name: Gate on type-check
        run: |
          grep -qE '^exit=0' ci/typecheck.log || {
            echo "::error::Type-check failed; see the CI diagnostics issue."
            exit 1
          }

      - name: Run NaviCore test suite
        # The core package is platform-independent, so it builds fine here and
        # proves the app is linking logic that still passes its own tests.
        run: swift test --filter NaviCoreTests

      - name: Build app and package IPA
        run: ./scripts/build-ios.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Coda-unsigned-ipa
          path: build-ios/Coda.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Bundle structure check
        run: |
          unzip -l build-ios/Coda.ipa
          # An .ipa is a zip whose single top-level directory is Payload/.
          unzip -l build-ios/Coda.ipa | grep -q 'Payload/Coda.app/Coda' \
            || { echo "::error::IPA is missing Payload/Coda.app/Coda"; exit 1; }
          unzip -p build-ios/Coda.ipa 'Payload/Coda.app/Info.plist' > /tmp/Info.plist
          plutil -lint /tmp/Info.plist
          plutil -extract CFBundleIdentifier raw /tmp/Info.plist
          plutil -extract MinimumOSVersion raw /tmp/Info.plist
